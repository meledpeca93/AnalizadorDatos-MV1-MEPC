<style>
:root{--ink:#18332f;--muted:#576d68;--green:#126553;--line:#dbe5de;--paper:#fffefb;--mint:#eaf4ec;--orange:#ab571b;--mono:ui-monospace,SFMono-Regular,Consolas,monospace;font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;color:var(--ink);background:#f5f6f0;font-synthesis:none}
*{box-sizing:border-box}
body{margin:0}
a{color:inherit}
button,input,select{font:inherit}
button,a,input,select,summary{ -webkit-tap-highlight-color:transparent}
button{cursor:pointer}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #c18036;outline-offset:4px}
button{touch-action:manipulation}
.skip{position:absolute;left:20px;top:-70px;background:var(--ink);color:white;padding:12px;z-index:4}
.skip:focus{top:12px}
.wrap{max-width:1200px;margin:auto;padding:0 32px}
.topbar{border-bottom:1px solid var(--line);background:var(--paper)}
.nav{min-height:78px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.brand{display:flex;align-items:center;gap:12px;font-size:14px;font-weight:750;text-decoration:none}
.logo{background:var(--green);color:#fff;border-radius:12px;padding:11px;font:700 16px var(--mono)}
.brand small{display:block;font-weight:450;color:var(--muted);font-size:11px;margin-top:3px}
.navlink{font-size:13px;text-decoration:none;border-bottom:1px solid #79988c;padding:7px 0}
.hero{padding:54px 0 30px;display:grid;grid-template-columns:1.5fr 1fr;gap:48px;align-items:center}
.eyebrow{font:650 11px var(--mono);letter-spacing:1.8px;color:var(--green);text-transform:uppercase}
.eyebrow:before{content:'';display:inline-block;width:7px;height:7px;background:#409477;border-radius:50%;margin-right:9px}
h1{font-size:clamp(30px,3.5vw,44px);letter-spacing:-1.8px;line-height:1.14;margin:16px 0}
h1 span{color:var(--green)}
p{color:var(--muted);line-height:1.65}
 .hero p{max-width:620px;font-size:15px;margin:0}
.concept{border:1px solid var(--line);background:#eef2e8;border-radius:18px;padding:24px;transform:rotate(-2deg)}
.concept-top{display:flex;align-items:center;justify-content:space-between;font:11px var(--mono);color:var(--muted);margin-bottom:20px}
.concept-line{display:flex;align-items:center;justify-content:space-between;gap:12px}
.concept-value{font:500 40px var(--mono);letter-spacing:-2px}
.concept-arrow{color:#7a9681;font-size:23px}
.concept-value small{font:500 12px var(--mono);letter-spacing:0;color:var(--muted);display:block;margin-top:7px}
.concept p{font-size:12px;margin:20px 0 0;border-top:1px solid #d0ddcf;padding-top:12px}
.intro-steps{display:flex;gap:24px;flex-wrap:wrap;padding:12px 0 30px;font-size:12px;color:var(--muted)}
.intro-steps b{color:var(--green);display:inline-grid;place-items:center;background:#e6eee3;border-radius:50%;width:22px;height:22px;margin-right:6px;font-size:11px}
.workspace{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}
.card{min-width:0;background:var(--paper);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 4px 12px #254c2d03}
.card-head{padding:26px 28px 22px;border-bottom:1px solid var(--line)}
.card-kicker{font:600 10px var(--mono);letter-spacing:1.6px;color:var(--green);text-transform:uppercase;display:flex;align-items:center;gap:8px}
.card-kicker span{background:var(--mint);padding:5px 7px;border-radius:5px}
h2{font-size:23px;letter-spacing:-.6px;margin:12px 0 6px}
.card-head p{font-size:13px;margin:0}
.card-body{padding:24px 28px 28px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.field{min-width:0}
label{display:block;font-size:12px;font-weight:650;margin-bottom:9px}
input:not([type=hidden]),select{width:100%;min-width:0;background:#fff;border:1px solid #b6c9bf;border-radius:8px;padding:13px 12px;color:var(--ink);min-height:48px}
input:not([type=hidden]){font-family:var(--mono)}
input:focus,select:focus{outline:3px solid #d0e8d9;border-color:var(--green)}
input[aria-invalid=true]{border-color:#b74132;background:#fff9f6}
.hint{font-size:11px;line-height:1.6;margin:9px 0 0;color:var(--muted)}
.examples{display:flex;align-items:center;flex-wrap:wrap;gap:7px;margin:18px 0}
.examples>span{font-size:11px;color:var(--muted);margin-right:3px}
.example{font:11px var(--mono);border:1px solid var(--line);background:#f8faf5;color:#385b4b;border-radius:6px;padding:7px 9px;min-height:32px}
.example:hover{border-color:#8da999;background:#eaf3e9}
.primary{background:var(--green);color:white;display:flex;align-items:center;justify-content:space-between;gap:20px;border:0;border-radius:8px;width:100%;min-height:48px;padding:13px 16px;font-size:13px;font-weight:650;transition:background .15s}
.primary:hover{background:#0b5141}
.primary span{font-size:19px;line-height:1}
.form-meta{display:flex;justify-content:space-between;align-items:start;gap:12px}
.count{font:11px var(--mono);white-space:nowrap;color:var(--muted);margin-top:9px}
.errorlist{list-style:none;padding:10px 12px;margin:10px 0;background:#fff0eb;border:1px solid #f0c8bc;border-radius:7px;color:#983522;font-size:12px;line-height:1.6}
.result{border-top:1px solid var(--line);padding:24px 28px;background:#fbfcf7;scroll-margin-top:20px}
.result:focus{outline:none}
.result-heading{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}
.result-heading h3{font-size:14px;margin:0}
.status{font:10px var(--mono);color:#386b51;background:#e6f1e5;border-radius:20px;padding:5px 9px;white-space:nowrap}
.representation{display:grid;grid-template-columns:112px 1fr auto;align-items:center;gap:12px;border:1px solid var(--line);background:white;border-radius:8px;padding:13px;margin:8px 0}
.representation dt{font-size:12px;color:var(--muted)}
.representation dt small{display:block;font:10px var(--mono);color:#71847b;margin-top:3px}
.representation dd{margin:0;min-width:0;font:600 18px var(--mono);overflow-wrap:anywhere}
.copy{border:0;border-radius:5px;background:#f0f4ed;color:#355b48;font-size:11px;min-width:44px;min-height:32px;padding:6px 8px}
.copy:hover{background:#e0ebdb}
.bit-label{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted);margin:20px 0 9px}
.byte-groups{display:flex;flex-wrap:wrap;gap:8px}
.byte{font:600 17px var(--mono);letter-spacing:2px;border:1px solid #b9d1be;border-radius:7px;padding:10px;background:#eff6eb;color:#254d3e}
.byte .padding{color:#70866d;font-weight:400}
.byte-legend{font-size:10px;color:var(--muted);margin:7px 0 0}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}
.metric{background:#edf2e8;border-radius:8px;padding:13px}
.metric strong{font:650 24px var(--mono);display:block}
.metric span{display:block;font-size:11px;color:var(--muted);margin-top:4px}
.explanation{font-size:12px;line-height:1.7;border-left:3px solid #97b69a;padding:0 0 0 12px;margin:18px 0 0}
.explanation strong{color:var(--ink)}
.empty{padding:22px 28px;border-top:1px dashed var(--line);background:#fafbf5;display:flex;gap:12px;align-items:start}
.empty-icon{color:#7a9681;font:24px var(--mono)}
.empty p{font-size:12px;margin:0}
.empty strong{color:var(--ink);display:block;margin-bottom:3px;font-weight:600}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:#fff}
.table-wrap:focus-visible{outline:3px solid #b4d3bf}
table{border-collapse:collapse;width:100%;text-align:left;font-size:12px}
caption{font-size:11px;color:var(--muted);text-align:left;padding:12px}
th{font-weight:600;font-size:10px;background:#edf2e8;color:#486352}
th,td{padding:12px 10px;border-top:1px solid #e5ebe0;white-space:nowrap}
td{font-family:var(--mono)}
.character{font-size:17px;font-weight:650;white-space:pre}
.utf8{color:var(--green);font-weight:650}
.learn{margin:32px 0 36px;padding:28px;border:1px solid var(--line);border-radius:16px;background:#ecf0e6}
.learn-heading{display:flex;align-items:baseline;justify-content:space-between;gap:20px}
.learn h2{font-size:18px;margin:0}
.learn-heading>p{font-size:12px;margin:0}
.learn-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;margin-top:22px}
.learn-item{border-left:1px solid #c5d3c2;padding-left:16px}
.learn-item h3{font-size:12px;margin:0 0 7px}
.learn-item p{font-size:12px;margin:0}
.learn details{border-top:1px solid #cdd9c8;margin-top:22px;padding-top:16px}
.learn summary{font-size:12px;cursor:pointer;font-weight:600;padding:4px 0}
.learn details p{font-size:12px;max-width:900px}
.footer{padding:0 0 28px;display:flex;justify-content:space-between;gap:16px;font-size:10px;color:var(--muted)}
.footer span:last-child{font-family:var(--mono)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;box-shadow:0 4px 18px #18332f26;border-radius:9px;padding:12px 20px;font-size:13px;z-index:5}
.toast:empty{display:none}
.js-only{display:none}
html.js .js-only{display:flex}
html.js button.js-only{display:inline-block}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:960px){.wrap{padding:0 22px}
.hero{gap:24px}
.concept-value{font-size:30px}
.field-row{grid-template-columns:1fr}
.card-head,.card-body,.result{padding-left:22px;padding-right:22px}
.representation{grid-template-columns:90px 1fr auto;gap:8px}
.representation dd{font-size:16px}
}
@media(max-width:720px){.nav{min-height:68px}
.brand{font-size:12px}
.brand small{font-size:10px}
.navlink{font-size:11px}
.hero{grid-template-columns:1fr;padding-top:32px;gap:26px}
h1{letter-spacing:-1px;max-width:540px}
.hero p{font-size:14px}
.concept{transform:none;max-width:480px;padding:18px}
.concept-top{margin-bottom:13px}
.concept-line{justify-content:start;gap:30px}
.concept p{margin-top:14px}
.intro-steps{gap:12px;padding:0 0 24px;font-size:10px}
.workspace{grid-template-columns:1fr;gap:20px}
.field-row{grid-template-columns:1fr 1fr}
.learn{padding:22px;margin-top:24px}
.learn-heading{display:block}
.learn-heading>p{margin-top:8px}
.learn-grid{grid-template-columns:1fr;gap:20px}
.footer{flex-direction:column;gap:8px}
}
@media(max-width:390px){.wrap{padding:0 14px}
.field-row{grid-template-columns:1fr}
.card-head,.card-body,.result,.empty{padding-left:18px;padding-right:18px}
.representation{grid-template-columns:80px 1fr auto}
.byte{font-size:15px;letter-spacing:1px}
.brand small{max-width:170px}
}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}
}

</style>
